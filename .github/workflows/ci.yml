name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/setup@v3
        with:
          version: 12
          cache: true
          require-lockfile: true

      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm format:check